name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    name: PHP, JavaScript and Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check PHP syntax
        run: find wp-content scripts -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check JavaScript syntax
        run: find wp-content -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check shell script syntax
        run: sh -n scripts/start.sh

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
