services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    ports:
      - "8080:80"
    environment:
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('WP_MEMORY_LIMIT', '256M');
        define('DISALLOW_FILE_EDIT', true);
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/dealer-site-core:/var/www/html/wp-content/plugins/dealer-site-core
      - ./wp-content/themes/dealer-starter:/var/www/html/wp-content/themes/dealer-starter

  setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    env_file: .env
    working_dir: /var/www/html
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/dealer-site-core:/var/www/html/wp-content/plugins/dealer-site-core
      - ./wp-content/themes/dealer-starter:/var/www/html/wp-content/themes/dealer-starter
      - ./scripts:/project/scripts:ro
    entrypoint: ["sh", "-c"]
    command: |
      set -eu
      echo "Waiting for WordPress files..."
      until [ -f /var/www/html/wp-load.php ]; do sleep 2; done
      echo "Installing WordPress if this is a fresh database..."
      until wp core is-installed --allow-root >/dev/null 2>&1; do
        if wp core install --url="$$WP_SITE_URL" --title="$$WP_SITE_TITLE" --admin_user="$$WP_ADMIN_USER" --admin_password="$$WP_ADMIN_PASSWORD" --admin_email="$$WP_ADMIN_EMAIL" --skip-email --allow-root; then
          break
        fi
        echo "WordPress is not ready yet; retrying in 5 seconds..."
        sleep 5
      done
      echo "Installing WooCommerce..."
      wp plugin is-installed woocommerce --allow-root || wp plugin install woocommerce --activate --allow-root
      wp plugin activate woocommerce --allow-root
      echo "Installing Rank Math SEO..."
      wp plugin is-installed seo-by-rank-math --allow-root || wp plugin install seo-by-rank-math --activate --allow-root
      wp plugin activate seo-by-rank-math --allow-root
      echo "Activating dealer modules..."
      wp plugin activate dealer-site-core --allow-root
      wp theme activate dealer-starter --allow-root
      echo "Seeding site pages, demo products, news and images..."
      wp eval-file /project/scripts/seed-site.php --allow-root
      wp language core install vi --activate --allow-root || true
      wp rewrite structure '/%postname%/' --hard --allow-root
      echo "Dealer website setup completed."
      echo "Open $$WP_SITE_URL and $$WP_SITE_URL/wp-admin"

volumes:
  db_data:
  wordpress_data:
